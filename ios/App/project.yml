name: TVRemote
options:
  bundleIdPrefix: com.dzafirov.tvskin
  deploymentTarget:
    iOS: "17.0"
packages:
  TVRemoteKit:
    path: ../TVRemoteKit
targets:
  TVRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TVRemote
    dependencies:
      - package: TVRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzafirov.tvskin.remote
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # Set TV_TEAM_ID in the environment (Task 11); empty until then.
        DEVELOPMENT_TEAM: ${TV_TEAM_ID}
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: TV Remote finds and controls your TV on this Wi-Fi.
        NSBonjourServices:
          - _androidtvremote2._tcp
